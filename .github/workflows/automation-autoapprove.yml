name: Automation (Auto-approve)

on:
  # Triggers the workflow on any pull request (but runs in context of target branch, having a bit higher rights)
  pull_request_target:
    types:
      - opened

jobs:
  automation:
    name: Automation tasks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Auto-approve (Developer)
        if: contains(fromJSON('["Jomshir98", "ClaudiaMia"]'), github.event.pull_request.user.login)
        uses: hmarr/auto-approve-action@v4.0.0
        with:
          review-message: "PR is from CC Bots Developer."

      - name: Auto-approve (Renovate)
        if: github.event.pull_request.user.login == 'renovate[bot]'
        uses: hmarr/auto-approve-action@v4.0.0
        with:
          review-message: "Automated dependency update."
